<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OakLand — direction C: Grove (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f4f0e4;
  --leaf: #ebe6d4;
  --ink: #1b2a1f;
  --dim: #5a6556;
  --rule: #cdc6ae;
  --moss: #4f7442;
  --sun: #b85e08;            /* the one warm colour: what is being evaluated right now */
  --sun-wash: rgba(184, 94, 8, .11);
  --display: "Fraunces", Georgia, serif;
  --ui: "Hanken Grotesk", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font: 14px/1.45 var(--ui); display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 18px; padding: 12px 24px; border-bottom: 1px solid var(--ink); flex: none; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 24px/1 var(--display); letter-spacing: -.01em; font-variation-settings: "opsz" 72; }
.brand svg { width: 22px; height: 22px; fill: var(--moss); }
.brand em { font-style: italic; font-weight: 500; color: var(--moss); }
.file { font: 12.5px var(--mono); color: var(--dim); }
.sp { flex: 1; }
.top button { background: none; border: 1px solid var(--ink); padding: 6px 16px; font-weight: 600; }
.top .run { background: var(--ink); color: var(--cream); }

.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 33fr) minmax(0, 40fr) minmax(280px, 27fr); }
.col { min-height: 0; overflow: auto; border-right: 1px solid var(--rule); }
.col:last-child { border-right: 0; }
.head { font: 600 12px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 14px 22px 8px; display: flex; justify-content: space-between; align-items: baseline; position: sticky; top: 0; background: var(--cream); z-index: 1; }
.head b { color: var(--sun); font-weight: 700; }

/* code */
.code ol { list-style: none; margin: 0; padding: 0 0 24px; font: 12px/20px var(--mono); }
.line { display: grid; grid-template-columns: 40px minmax(0, 1fr); border-left: 3px solid transparent; }
.line .n { text-align: right; padding-right: 12px; color: #8b9684; font-size: 11px; user-select: none; }
.line .src { white-space: pre; padding-right: 12px; }
.line.now { background: var(--sun-wash); border-left-color: var(--sun); }
.line.now .n { color: var(--sun); font-weight: 600; }
.t-kw { color: var(--moss); font-weight: 500; } .t-ty { color: #7a7253; } .t-lit, .t-num { color: var(--sun); } .t-str { color: #6a5a2a; } .t-cm { color: #8b9684; font-style: italic; } .t-p { color: #46523f; }

/* tree */
.tree-wrap { padding: 6px 22px 30px; }
.tree-title { font: 500 21px/1.2 var(--display); margin: 4px 0 2px; font-variation-settings: "opsz" 48; }
.tree-sub { color: var(--dim); font-size: 12.5px; margin: 0 0 18px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree li { position: relative; display: flex; align-items: center; padding: 2px 0 2px 22px; }
.tree > li { padding-left: 0; }
.tree li > ul { display: flex; flex-direction: column; }
.tree li::before { content: ""; position: absolute; left: 0; top: 50%; width: 22px; border-top: 1px solid var(--moss); }
.tree > li::before { display: none; }
.tree li::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid var(--moss); }
.tree li:first-child::after { top: 50%; }
.tree li:last-child::after { bottom: 50%; }
.tree li:only-child::after { display: none; }
.tree > li::after { display: none; }
.chip { display: inline-flex; flex-direction: column; border: 1px solid var(--moss); background: var(--cream); padding: 2px 7px 3px; min-width: 44px; position: relative; }
.chip small { font: 600 9.5px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.chip code { font: 500 12px var(--mono); }
.chip.quiet { border-style: dashed; border-color: var(--rule); background: none; }
.chip.quiet code { color: var(--dim); }
.chip.on { border-color: var(--sun); background: var(--sun-wash); }
.chip.on small { color: var(--sun); }
.chip .badge { position: absolute; right: -1px; top: -9px; background: var(--sun); color: #fff; font: 600 10.5px var(--mono); padding: 0 5px; }
.more { font: 12px var(--mono); color: var(--dim); }

/* state column */
.state { background: var(--leaf); display: flex; flex-direction: column; }
.state .head { background: var(--leaf); position: static; }
.sec { padding: 8px 22px 18px; }
.big { font: 600 34px/1.15 var(--display); font-variation-settings: "opsz" 30; letter-spacing: -.02em; margin: 0 0 2px; }
.big small { font: 400 14px var(--ui); color: var(--dim); letter-spacing: 0; }
.what { font: 13px var(--mono); margin: 4px 0 10px; }
.what b { color: var(--sun); }
.grow { height: 4px; background: var(--rule); } .grow i { display: block; height: 100%; background: var(--moss); }
.vars { list-style: none; margin: 0; padding: 0; }
.vars li { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.vars .name { font: 500 13px var(--mono); }
.vars .type { color: var(--dim); font-size: 11.5px; text-align: right; }
.vars .value { grid-column: 1 / -1; font: 15px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vars li.changed .name::before { content: "▸ "; color: var(--sun); }
.vars li.changed .value { color: var(--sun); font-weight: 500; }
[role=tablist] { display: flex; gap: 16px; padding: 0 22px; border-bottom: 1px solid var(--ink); }
[role=tab] { background: none; border: 0; padding: 10px 0 8px; font-weight: 500; color: var(--dim); border-bottom: 3px solid transparent; margin-bottom: -1px; }
[role=tab][aria-selected=true] { color: var(--ink); font-weight: 700; border-bottom-color: var(--moss); }
[role=tab] sup { color: var(--sun); font-weight: 700; }
.pane { padding: 12px 22px 24px; }
pre.out { margin: 0; font: 10.5px/1.3 var(--mono); overflow: auto; }
pre.out .fresh { color: var(--sun); font-weight: 500; }
.meta { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding-bottom: 6px; border-bottom: 1px solid var(--ink); }
td { padding: 6px 6px 6px 0; border-bottom: 1px solid var(--rule); font-family: var(--mono); }
.problems { list-style: none; margin: 0; padding: 0; }
.problems li { display: grid; grid-template-columns: 70px 48px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
.phase { color: var(--sun); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.where { font-family: var(--mono); color: var(--dim); }

.bar { flex: none; border-top: 1px solid var(--ink); background: var(--leaf); display: flex; align-items: center; gap: 18px; padding: 10px 24px; }
.btns { display: flex; gap: 6px; }
.btns button { width: 36px; height: 34px; border: 1px solid var(--ink); background: var(--cream); }
.btns .play { width: 74px; background: var(--ink); color: var(--cream); font-weight: 600; }
.bar input { flex: 1; accent-color: var(--moss); height: 22px; }
.bar .r { font: 500 13px var(--mono); min-width: 130px; text-align: right; }
.mtabs { display: none; }

@media (max-width: 760px) {
  .top { padding: 10px 16px; }
  .brand { font-size: 21px; }
  .file, .top .ex { display: none; }
  .mtabs { display: flex; border-bottom: 1px solid var(--ink); flex: none; }
  .mtabs button { flex: 1; background: none; border: 0; padding: 10px 0 8px; color: var(--dim); font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .mtabs button[aria-selected=true] { color: var(--ink); font-weight: 700; border-bottom-color: var(--moss); }
  .grid { display: block; overflow: auto; }
  .col { border: 0; overflow: visible; }
  body[data-view=code] .tree-col, body[data-view=code] .state, body[data-view=tree] .code, body[data-view=tree] .state, body[data-view=state] .code, body[data-view=state] .tree-col { display: none; }
  .head { padding: 12px 16px 8px; }
  .sec, .pane { padding-left: 16px; padding-right: 16px; } [role=tablist] { padding: 0 16px; }
  .tree-wrap { padding: 4px 16px 24px; overflow-x: auto; }
  .tree-wrap { font-size: 12px; }
  .bar { flex-wrap: wrap; padding: 8px 16px 10px; gap: 8px; }
  .btns { width: 100%; } .btns button { flex: 1; }
  .bar input { width: 100%; flex-basis: 100%; }
  .bar .r { text-align: left; min-width: 0; }
}
</style>
</head>
<body data-view="code">
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c-1.6 1.7-5 4.3-5 9 0 2.9 1.3 5 3.3 6.2V22h3.4v-5.3c2-1.2 3.3-3.3 3.3-6.2 0-4.7-3.4-7.3-5-9z" opacity=".95"/></svg>
    <span>Oak<em>Land</em></span>
  </div>
  <span class="file" id="file"></span>
  <span class="sp"></span>
  <button type="button" class="ex">Examples ▾</button>
  <button type="button" class="run">Run ▸</button>
</header>

<div class="mtabs" role="tablist" aria-label="View">
  <button role="tab" data-v="code" aria-selected="true">Code</button>
  <button role="tab" data-v="tree" aria-selected="false">Tree</button>
  <button role="tab" data-v="state" aria-selected="false">State</button>
</div>

<main class="grid">
  <section class="col code" aria-label="Source code">
    <div class="head"><span>Source</span><span id="where"></span></div>
    <ol id="code"></ol>
  </section>

  <section class="col tree-col" aria-label="Syntax tree">
    <div class="head"><span>Syntax tree</span><span id="evalnote"></span></div>
    <div class="tree-wrap">
      <h2 class="tree-title" id="treetitle"></h2>
      <p class="tree-sub" id="treesub"></p>
      <ul class="tree" id="tree"></ul>
    </div>
  </section>

  <aside class="col state" aria-label="Run state" id="state">
    <div class="head"><span>Now</span></div>
    <div class="sec">
      <p class="big" id="big"></p>
      <p class="what" id="what"></p>
      <div class="grow"><i id="fill"></i></div>
    </div>
    <div class="head"><span>Variables</span></div>
    <div class="sec"><ul class="vars" id="vars"></ul></div>
    <div role="tablist">
      <button role="tab" data-tab="out">Output</button>
      <button role="tab" data-tab="problems">Problems<sup id="pcount"></sup></button>
      <button role="tab" data-tab="symbols">Symbols</button>
    </div>
    <div class="pane" data-pane="out"><pre class="out" id="out"></pre><p class="meta" id="rows"></p></div>
    <div class="pane" data-pane="problems"><ul class="problems" id="problems"></ul><p class="meta" id="pnote"></p></div>
    <div class="pane" data-pane="symbols"><table><thead><tr><th>Name</th><th>Kind</th><th>Type</th><th>Scope</th></tr></thead><tbody id="symbols"></tbody></table></div>
  </aside>
</main>

<footer class="bar" aria-label="Step through the run">
  <div class="btns">
    <button type="button" id="first" aria-label="Back to the start">⏮</button>
    <button type="button" id="prev" aria-label="Back 100 steps">◂</button>
    <button type="button" id="play" class="play">Play</button>
    <button type="button" id="next" aria-label="Forward 100 steps">▸</button>
  </div>
  <input type="range" id="slider" min="0" aria-label="Step">
  <div class="r" id="readout"></div>
</footer>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
const { OAK, esc, int, codeLine, FEATURED, outputRows, player, tabs, symbolsRows, problemsRows } = M;
const $ = (id) => document.getElementById(id);
$("file").textContent = OAK.program.name;
const slider = $("slider"); slider.max = OAK.snapshots.length - 1;
$("code").innerHTML = OAK.program.lines.map((_, i) => `<li class="line" data-n="${i + 1}"><span class="n">${i + 1}</span><span class="src">${codeLine(i + 1)}</span></li>`).join("");
const lines = [...document.querySelectorAll(".line")];
$("symbols").innerHTML = symbolsRows();
$("problems").innerHTML = problemsRows();
$("pcount").textContent = OAK.problems.items.length;
$("pnote").textContent = `None in the diamond. These come from ${OAK.problems.from}, which has mistakes on purpose.`;
tabs($("state"));

const KIND = { If: "if", While: "while", For: "for", ExprStmt: "statement", VarDecl: "declaration", Print: "print", Assign: "assign", Binary: "operator", Identifier: "name", Literal: "value", Group: "group", Unary: "unary", Call: "call", Block: "block" };
function treeHtml(node, on, badge) {
  const kind = KIND[node.kind] || node.kind.toLowerCase();
  const chip = `<span class="chip ${on && !node.quiet ? "on" : ""} ${node.quiet ? "quiet" : ""}"><small>${esc(kind)}</small><code>${esc(node.label)}</code>${badge ? `<span class="badge">${esc(badge)}</span>` : ""}</span>`;
  const children = node.children.map((c) => treeHtml(c, on, null)).join("") || (node.more ? `<li><span class="more">… ${node.more} more</span></li>` : "");
  return `<li>${chip}${children ? `<ul>${children}</ul>` : ""}</li>`;
}
const treeFor = (line) => { for (let l = line; l >= 1; l--) if (OAK.trees[l]) return [l, OAK.trees[l]]; return [1, OAK.trees[1]]; };
const src = OAK.program.source.split(/\r?\n/);

function render(k) {
  const s = OAK.snapshots[k];
  slider.value = k;
  lines.forEach((el) => el.classList.toggle("now", Number(el.dataset.n) >= s.line && Number(el.dataset.n) <= s.endLine));
  const cur = document.querySelector(".line.now"); if (cur) cur.scrollIntoView({ block: "nearest" });
  $("where").textContent = `line ${s.line}`;
  const [line, tree] = treeFor(s.line);
  const isCondition = s.kind === "condition";
  $("treetitle").textContent = tree.kind === "If" ? "if (…)" : tree.kind === "While" ? "while (…)" : src[line - 1].trim().slice(0, 40);
  $("treesub").textContent = isCondition ? `The condition is being evaluated; the whole tree is the expression.` : `The statement that just ran, as the interpreter reads it.`;
  $("evalnote").innerHTML = isCondition ? `<b>evaluating</b>` : "ran";
  let shown = tree;
  if (isCondition && (tree.kind === "If" || tree.kind === "While") && tree.children.length) {
    shown = { ...tree, children: [tree.children[0], { kind: "Block", label: tree.kind === "If" ? "then / else" : "body", children: [], more: 0, quiet: true }] };
  }
  $("tree").innerHTML = treeHtml(shown, true, isCondition ? s.note : null);
  $("big").innerHTML = `${int(s.index)} <small>of ${int(OAK.run.steps)}</small>`;
  $("what").innerHTML = s.kind === "condition" ? `condition → <b>${esc(s.note)}</b>` : s.kind === "end" ? "<b>program finished</b>" : "statement ran";
  $("fill").style.width = (s.index / (OAK.run.steps - 1)) * 100 + "%";
  $("vars").innerHTML = s.variables.map((v) => `<li class="${v.changed ? "changed" : ""}"><span class="name">${esc(v.name)}</span><span class="type">${esc(v.type)}</span><span class="value" title="${esc(v.value)}">${esc(v.value)}</span></li>`).join("");
  const rows = outputRows(s);
  $("out").innerHTML = rows.map((r, i) => (i === rows.length - 1 && s.index < OAK.run.steps - 2 ? `<span class="fresh">${esc(r)}</span>` : esc(r))).join("\n");
  $("rows").textContent = `${rows.length} of ${OAK.run.rows} rows printed`;
  $("readout").textContent = `step ${int(s.index)}`;
}
const p = player(render, FEATURED);
$("play").addEventListener("click", () => { p.toggle(); $("play").textContent = p.playing ? "Pause" : "Play"; });
$("prev").addEventListener("click", () => p.step(-1));
$("next").addEventListener("click", () => p.step(1));
$("first").addEventListener("click", () => p.go(0));
slider.addEventListener("input", () => p.go(Number(slider.value)));
document.querySelectorAll(".mtabs [data-v]").forEach((b) => b.addEventListener("click", () => {
  document.body.dataset.view = b.dataset.v;
  document.querySelectorAll(".mtabs [data-v]").forEach((q) => q.setAttribute("aria-selected", String(q === b)));
}));
</script>
</body>
</html>
